<script>
(function() {
  // 1. Instant Hover Prefetcher (悬浮预加载，消除点击网络延迟)
  const prefetched = new Set();
  function prefetch(url) {
    if (!url || prefetched.has(url) || url.startsWith('#') || url.includes('mailto:') || (url.startsWith('http') && !url.startsWith(window.location.origin))) return;
    prefetched.add(url);
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = url;
    document.head.appendChild(link);
  }

  document.addEventListener('mouseover', function(e) {
    const a = e.target.closest('a');
    if (a && a.href && a.origin === window.location.origin) {
      prefetch(a.pathname + a.search);
    }
  }, { passive: true });

  document.addEventListener('touchstart', function(e) {
    const a = e.target.closest('a');
    if (a && a.href && a.origin === window.location.origin) {
      prefetch(a.pathname + a.search);
    }
  }, { passive: true });

  // 2. Track & Restore List URLs
  const path = window.location.pathname;
  const isPost = path.includes('/202') || (path.startsWith('/posts/') && path !== '/posts/' && !path.startsWith('/posts/page/'));

  if (!isPost) {
    sessionStorage.setItem('lastListUrl', path + window.location.search);
  } else {
    const backBtn = document.getElementById('back-button');
    if (backBtn) {
      const lastList = sessionStorage.getItem('lastListUrl');
      if (lastList) {
        backBtn.href = lastList;
      }
    }
  }

  // 3. Gemini Glow Scroll Dynamics (背景光晕视差与平滑衰减)
  const glow = document.querySelector('.gemini-glow');
  if (glow && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let ticking = false;
    function updateGlow() {
      const scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
      // 缓和过渡区间：在前 700px 滚动距离内平滑过渡
      const progress = Math.min(1, Math.max(0, scrollY / 700));
      // 视差上浮：最大上浮 110px，营造深层星云随内容流动的纵深感
      const translateY = -110 * progress;
      // 柔化衰减：从 1.0 渐变至 0.38（保留环境微光，阅读时沉静不抢戏）
      const opacityFactor = 1 - 0.62 * progress;
      // 柔和扩散：微扩 1.06 倍
      const scale = 1 + 0.06 * progress;

      glow.style.setProperty('--glow-parallax-y', translateY.toFixed(1) + 'px');
      glow.style.setProperty('--glow-decay-opacity', opacityFactor.toFixed(3));
      glow.style.setProperty('--glow-decay-scale', scale.toFixed(3));
      ticking = false;
    }

    window.addEventListener('scroll', function() {
      if (!ticking) {
        window.requestAnimationFrame(updateGlow);
        ticking = true;
      }
    }, { passive: true });

    window.addEventListener('pageshow', updateGlow);
    updateGlow();
  }
})();
</script>
