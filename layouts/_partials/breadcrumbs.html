{{- if (.Param "ShowBreadCrumbs") -}}
<nav class="breadcrumbs" role="navigation" aria-label="Breadcrumb">
    {{- $ancestors := .Ancestors.Reverse -}}
    <span class="bc-root-prefix">
        <a href="/">{{ i18n "home" | default "主页" }}</a>
        <span class="bc-sep" aria-hidden="true">&raquo;</span>
    </span>
    <span class="{{ if not .IsPage }}bc-dynamic-wrap{{ else }}bc-page-wrap{{ end }}">
        {{- range $i, $bc := $ancestors }}
            {{- if gt $i 0 }}
                <a href="{{ $bc.RelPermalink }}">{{ $bc.Title }}</a>
                <span class="bc-sep" aria-hidden="true">&raquo;</span>
            {{- end }}
        {{- end }}
        <span class="bc-current" aria-current="page">{{ .Title }}</span>
    </span>
</nav>
{{- end -}}
