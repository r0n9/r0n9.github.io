{{- $paginator := . }}
{{- if gt $paginator.TotalPages 1 }}
<footer class="page-footer">
  <nav class="pagination" role="navigation" aria-label="分页导航">
    {{- if $paginator.HasPrev }}
    <a class="prev" href="{{ $paginator.Prev.URL | absURL }}" aria-label="前往上一页">
      <svg class="pagination-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path stroke="none" d="M0 0h24v24H0z"/>
        <path d="M5 12h14M5 12l6 6M5 12l6-6"/>
      </svg>
      <span>上一页</span>
    </a>
    {{- else }}
    <span class="prev disabled" aria-disabled="true" aria-label="上一页不可用">
      <svg class="pagination-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path stroke="none" d="M0 0h24v24H0z"/>
        <path d="M5 12h14M5 12l6 6M5 12l6-6"/>
      </svg>
      <span>上一页</span>
    </span>
    {{- end }}

    <span class="page-num">{{ $paginator.PageNumber }} / {{ $paginator.TotalPages }}</span>

    {{- if $paginator.HasNext }}
    <a class="next" href="{{ $paginator.Next.URL | absURL }}" aria-label="前往下一页">
      <span>下一页</span>
      <svg class="pagination-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path stroke="none" d="M0 0h24v24H0z"/>
        <path d="M5 12h14M13 18l6-6M13 6l6 6"/>
      </svg>
    </a>
    {{- else }}
    <span class="next disabled" aria-disabled="true" aria-label="下一页不可用">
      <span>下一页</span>
      <svg class="pagination-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path stroke="none" d="M0 0h24v24H0z"/>
        <path d="M5 12h14M13 18l6-6M13 6l6 6"/>
      </svg>
    </span>
    {{- end }}
  </nav>
</footer>
{{- end }}
