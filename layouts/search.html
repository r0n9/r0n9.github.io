{{- define "main" }}

{{- partial "breadcrumbs.html" . }}

<div class="page-content-wrapper">
  <header class="page-header search-page-header">
    <h1 class="search-page-title">
      {{- (printf "%s" .Title) -}}
    </h1>
    <div class="post-description search-page-description">
      {{ with .Description }}{{ . }}{{ else }}搜索站内所有文章。{{ end }}
    </div>
  </header>

  <div id="searchbox" class="searchbox">
    <div class="search-input-wrapper">
      <svg class="search-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="searchInput" disabled placeholder="{{ .Params.placeholder | default "搜索文章标题、标签或正文内容..." }}"
        aria-label="search" type="search" autocomplete="off" maxlength="64">
      <button id="searchClearBtn" class="search-clear-btn" type="button" aria-label="清空搜索" title="清空">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="searchStats" class="search-stats"></div>
    <ul id="searchResults" class="searchResults" aria-label="search results"></ul>
  </div>
</div>

{{- end }}{{/* end main */}}
