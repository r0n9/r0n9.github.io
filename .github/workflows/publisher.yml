name: Build and Release Publisher

on:
  push:
    branches:
      - master
    paths:
      - "tools/publisher/**"
      - ".github/workflows/publisher.yml"
    tags:
      - "publisher-v*"
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: "publisher-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # Job 1: 交叉编译多架构二进制并打包发布至 GitHub Release
  # ----------------------------------------------------
  release-binaries:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools/publisher/go.mod

      - name: Build Multi-Architecture Binaries
        working-directory: tools/publisher
        run: |
          mkdir -p dist

          targets=(
            "linux/amd64/publisher-linux-amd64"
            "linux/arm64/publisher-linux-arm64"
            "darwin/amd64/publisher-darwin-amd64"
            "darwin/arm64/publisher-darwin-arm64"
            "windows/amd64/publisher-windows-amd64.exe"
          )

          for target in "${targets[@]}"; do
            IFS="/" read -r os arch filename <<< "$target"
            echo "==> Building $os/$arch -> dist/$filename"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/$filename" .
            
            # 打包为压缩包
            if [ "$os" = "windows" ]; then
              (cd dist && zip "${filename%.exe}.zip" "$filename" && rm "$filename")
            else
              (cd dist && tar -czf "${filename}.tar.gz" "$filename" && rm "$filename")
            fi
          done

          # 计算哈希校验值
          cd dist
          sha256sum * > sha256sums.txt
          echo "Generated artifacts:"
          ls -lh

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=publisher-latest" >> $GITHUB_OUTPUT
            echo "release_name=Publisher Latest Build" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          files: tools/publisher/dist/*
          generate_release_notes: true
          make_latest: "legacy"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------
  # Job 2: 构建多架构 Docker 镜像并推送至 GHCR
  # ----------------------------------------------------
  docker-ghcr:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/blog-publisher
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: tools/publisher
          file: tools/publisher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
