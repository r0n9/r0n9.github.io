baseURL: "https://r0n9.github.io/"
title: "R0n9's Blog"
paginate: 10
theme: "PaperMod"
defaultContentLanguage: "zh"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

permalinks:
  posts: "/:year/:month/:day/:title/"
  moments: "/moment/:filename/"

taxonomies:
  category: categories
  tag: tags

menu:
  main:
    - name: "文章"
      url: "/posts/"
      weight: 10
    - name: "动态"
      url: "/moments/"
      weight: 15
    - name: "归档"
      url: "/archives/"
      weight: 20
    - name: "搜索"
      url: "/search/"
      weight: 30
    - name: "分类"
      url: "/categories/"
      weight: 40
    - name: "标签"
      url: "/tags/"
      weight: 50
    - name: "关于"
      url: "/about/"
      weight: 60

params:
  env: production
  title: "R0n9's Blog"
  description: "R0n9 的个人技术博客，记录 Go、HomeLab、边缘计算、WebRTC、网络安全与日常折腾实践"
  keywords: ["技术博客", "Go", "HomeLab", "Docker", "MySQL", "WebRTC", "iOS", "Swift", "Boardrop", "AirClipboard"]
  author: "R0n9"
  avatar: "/images/avatar.webp"
  mainSections: ["posts"]

  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"

  comments: true
  interactionApi: "https://blog-publisher.fanrong3304402.workers.dev" # Cloudflare Worker 服务地址

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "R0n9's Blog 👋"
    Content: |
      后端开发者 · 开源探索者 · HomeLab 极客

      热衷于打磨轻量高效的私有化工具，专注 **Go / 云原生 / 边缘计算 / 跨端协同**：
      - 📹 **流媒体与私有云**：轻量自建 NAS 视频监控系统 [camkeep](https://github.com/r0n9/camkeep)、网盘流媒体挂载工具 [openlist-strm-go](https://github.com/r0n9/openlist-strm-go)
      - 🔒 **隐私安全与效率**：纯离线密码管理插件 [vaultwarden-offline](https://github.com/r0n9/vaultwarden-offline)、跨设备隔空剪贴板 Boardrop
      - 🌐 **网络协议与运维**：WebRTC 实时通信、NAT 穿透、Cloudflare Serverless 与 Linux 自动化

      这里记录系统架构、开发实践与软硬件折腾心得。欢迎交流！

  socialIcons:
    - name: "github"
      url: "https://github.com/r0n9"
    - name: "email"
      url: "mailto:87953343@qq.com"
    - name: "rss"
      url: "/index.xml"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 100
    threshold: 0.2
    minMatchCharLength: 1
    ignoreLocation: true
    keys:
      - name: "title"
        weight: 0.6
      - name: "description"
        weight: 0.25
      - name: "content"
        weight: 0.15
